[package]
name = "bv_editor_ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Docking/shell framework on bevy_ui: splitter, tab bar, tree widget, property grid."

[dependencies]
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_input = { workspace = true, features = ["mouse"] }
bevy_window = { workspace = true }
bevy_ui = { workspace = true }
bevy_text = { workspace = true }
bevy_color = { workspace = true }
bevy_math = { workspace = true }
bevy_asset = { workspace = true }
bevy_image = { workspace = true }
# Only for `Extent3d`/`TextureDimension`/`TextureFormat` to build the F6
# built-in icon's procedural sprite sheet (see `icon.rs`) — these are
# `bevy_image`'s own re-export source, not a rendering dependency, so this
# stays far lighter than pulling in all of `bevy_render` for three type defs.
wgpu-types = { version = "29.0.3", default-features = false }

[dev-dependencies]
bv_editor_test_utils = { workspace = true }
