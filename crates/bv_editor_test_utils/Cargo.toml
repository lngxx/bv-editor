[package]
name = "bv_editor_test_utils"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless test harness for bv-editor: build an App with no window, step frames, simulate input."

[dependencies]
# "keyboard"/"mouse" enabled explicitly: this crate must compile standalone
# (e.g. as a dev-dependency of a crate that doesn't itself pull in a full
# `bevy` with default features, such as `third_party_extension`), it must not
# rely on some sibling crate in the same build unifying these features in.
bevy = { workspace = true, features = ["keyboard", "mouse", "bevy_state"] }
